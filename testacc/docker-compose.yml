# midPoint acceptance-test environment, adapted from the official Evolveum
# native-PostgreSQL docker-compose layout. Start with `make env-up`, remove
# containers and volumes with `make env-down`.
name: midpoint-testacc

services:
  midpoint_data:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=db.secret.pw.007
      - POSTGRES_USER=midpoint
      - POSTGRES_INITDB_ARGS=--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "midpoint"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - midpoint_data:/var/lib/postgresql/data

  data_init:
    image: evolveum/midpoint:${MIDPOINT_VERSION:-4.9}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      if [ $$(bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ; grep -c \"ERROR\" /tmp/ninja.log) -gt 0 ] ;
      then
        bin/ninja.sh run-sql --create --mode REPOSITORY ;
        bin/ninja.sh run-sql --create --mode AUDIT ;
      else
        echo 'Repository init is not needed' ;
      fi ;
      "
    depends_on:
      midpoint_data:
        condition: service_healthy
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_INIT_CFG=/opt/midpoint/var
    volumes:
      - midpoint_home:/opt/midpoint/var

  midpoint_server:
    image: evolveum/midpoint:${MIDPOINT_VERSION:-4.9}-alpine
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=db.secret.pw.007
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
      - MP_NO_ENV_COMPAT=1
      - MP_SET_midpoint_administrator_initialPassword=Test5ecr3t
    volumes:
      - midpoint_home:/opt/midpoint/var

volumes:
  midpoint_data:
  midpoint_home:
